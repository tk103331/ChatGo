name: Relay

# Builds the self-hosted relay for the platforms operators use, and attaches
# the binaries to the GitHub release for a v* tag. The relay needs no cgo and
# no platform SDK, so one Linux runner builds every target.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cmd/relayd/**"
      - "internal/relay/**"
      - "internal/e2e/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "cmd/relayd/**"
      - "internal/relay/**"
      - "internal/e2e/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test the relay
        run: |
          bash -n scripts/install-relay.sh
          if command -v shellcheck >/dev/null; then shellcheck scripts/install-relay.sh; fi
          go test ./internal/relay/... ./internal/e2e/...
          go vet ./cmd/relayd/... ./internal/relay/... ./internal/e2e/...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build relayd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/relayd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/relayd
          file "dist/relayd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}"
      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: relayd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/relayd-*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the relay binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the relay binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml creates the draft release for the same tag. Wait a
          # little for it, and create it here if that job has not landed yet.
          for i in 1 2 3 4 5; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            sleep 3
          done
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/relayd-* --repo "$GITHUB_REPOSITORY" --clobber
          ls -lh dist

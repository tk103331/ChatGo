<!doctype html>
<html lang="zh-CN" style="height:100%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChatGo</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #f5f5f2; overflow: hidden; }
    #mygo { position: fixed; inset: 0; }
    #error {
      display: none;
      padding: 24px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #9b2c2c;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="mygo"></div>
  <pre id="error"></pre>
  <script src="wasm_exec.js"></script>
  <script>
    (async () => {
      try {
        const go = new Go();
        const result = await WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject);
        await go.run(result.instance);
      } catch (err) {
        const box = document.getElementById("error");
        box.style.display = "block";
        box.textContent = "ChatGo web failed to start: " + err + "\n\nRun ./web/build.sh and reload.";
      }
    })();
  </script>
</body>
</html>
